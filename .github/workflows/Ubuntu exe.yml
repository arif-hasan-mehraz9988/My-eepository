name: SSHX Access

on:
  workflow_dispatch:

jobs:
  sshx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshx
        run: |
          curl -fsSL https://get.sshx.io | sh

      - name: Start sshx session
        run: |
          ./sshx --with-browser
        # The --with-browser flag will print a browser link in the logs

      - name: Keep runner alive
        run: sleep 3600
