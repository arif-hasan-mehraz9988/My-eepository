name: Ubuntu Gnome Remote Desktop

on:
  workflow_dispatch:
    inputs:
      crd_code:
        description: 'Paste the Chrome Remote Desktop "Debian Linux" code here (e.g., 4/0A...)'
        required: true
      pin:
        description: 'Create a 6-digit PIN for the session'
        required: true
        default: '123456'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours max usage

    steps:
    - name: Update and Upgrade
      run: sudo apt-get update

    - name: Install Desktop Environment (GNOME)
      # This takes 5-10 minutes due to the size of GNOME
      run: |
        sudo apt-get install -y ubuntu-desktop task-gnome-desktop
        sudo apt-get install -y --no-install-recommends google-chrome-stable

    - name: Install Chrome Remote Desktop
      run: |
        wget https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
        sudo dpkg --install chrome-remote-desktop_current_amd64.deb || sudo apt-get install --fix-broken -y

    - name: Configure Session
      # We must tell CRD to launch Gnome. 
      # Disabling gdm3 prevents conflicts with the headless session.
      run: |
        sudo bash -c 'echo "exec /etc/X11/Xsession /usr/bin/gnome-session" > /etc/chrome-remote-desktop-session'
        sudo systemctl disable gdm3
        sudo service gdm3 stop

    - name: Create User and Add to Groups
      # CRD works best when the user has a defined group membership
      run: |
        sudo usermod -a -G chrome-remote-desktop $USER
        # Ensure the config directory exists
        mkdir -p ~/.config/chrome-remote-desktop
        chown "$USER:$USER" ~/.config/chrome-remote-desktop

    - name: Start Chrome Remote Desktop
      env:
        DISPLAY_CODE: ${{ github.event.inputs.crd_code }}
        PIN: ${{ github.event.inputs.pin }}
      run: |
        DISPLAY= /opt/google/chrome-remote-desktop/start-host \
          --code="$DISPLAY_CODE" \
          --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
          --name="GitHub-Action-Runner" \
          --pin="$PIN"

    - name: Keep Alive
      # This loop keeps the container running so you can stay connected.
      run: |
        echo "Session Started. Connect via https://remotedesktop.google.com/access"
        while true; do sleep 360; done
