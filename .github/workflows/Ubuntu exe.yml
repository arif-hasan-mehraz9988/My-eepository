name: Ubuntu Remote Desktop (v2 Robust)

on:
  workflow_dispatch:
    inputs:
      crd_code:
        description: 'Paste the Debian Linux code from remotedesktop.google.com/headless'
        required: true
      pin:
        description: 'Set a 6-digit PIN'
        required: true
        default: '123456'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours max

    steps:
    - name: Update & Install Essentials
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          curl wget task-xfce-desktop xfce4 xfce4-goodies \
          xvfb python3-psutil

    - name: Install Google Chrome
      run: |
        wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo dpkg --install google-chrome-stable_current_amd64.deb || sudo apt-get install --fix-broken -y
        rm google-chrome-stable_current_amd64.deb

    - name: Install Chrome Remote Desktop
      run: |
        wget https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
        sudo dpkg --install chrome-remote-desktop_current_amd64.deb || sudo apt-get install --fix-broken -y
        rm chrome-remote-desktop_current_amd64.deb

    - name: Configure XFCE (Force Headless)
      run: |
        # Set XFCE as the default session
        sudo bash -c 'echo "exec /etc/X11/Xsession /usr/bin/xfce4-session" > /etc/chrome-remote-desktop-session'
        
        # Remove interfering display managers (CRITICAL FIX for connection errors)
        sudo apt-get remove -y gdm3 lightdm || true
        sudo apt-get purge -y gdm3 lightdm || true
        sudo apt-get autoremove -y

    - name: Setup User Environment
      run: |
        sudo usermod -a -G chrome-remote-desktop $USER
        
        # Create config dir with correct permissions
        mkdir -p ~/.config/chrome-remote-desktop
        chown "$USER:$USER" ~/.config/chrome-remote-desktop
        chmod 700 ~/.config/chrome-remote-desktop
        
        # Set default screen size to prevent "headless" crashes
        echo "CHROME_REMOTE_DESKTOP_DEFAULT_DESKTOP_SIZES=1920x1080" >> ~/.profile

    - name: Start Chrome Remote Desktop
      env:
        DISPLAY_CODE: ${{ github.event.inputs.crd_code }}
        PIN: ${{ github.event.inputs.pin }}
      run: |
        # Stop any lingering services
        /opt/google/chrome-remote-desktop/chrome-remote-desktop --stop-modeless || true
        
        # Start the host using the native binary
        DISPLAY= /opt/google/chrome-remote-desktop/start-host \
          --code="$DISPLAY_CODE" \
          --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
          --name="GitHub-XFCE-Runner" \
          --pin="$PIN"

    - name: Verify & Keep Alive
      run: |
        # Check if the service is actually running
        if ! ps aux | grep -q "chrome-remote-desktop"; then
          echo "ERROR: Chrome Remote Desktop failed to start."
          exit 1
        fi
        
        echo "SUCCESS: Session is running."
        echo "Go to https://remotedesktop.google.com/access to connect."
        
        # Loop to keep the machine running
        while true; do sleep 60; done
